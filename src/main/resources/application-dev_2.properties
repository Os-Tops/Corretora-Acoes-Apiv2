#conexao ao postgresql
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/acoes_corretoradb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}

#define a forma de geração do banco de dados
spring.jpa.hibernate.ddl-auto=update

# gera log
logging.file.name=acoes_corretora_dev.log
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

#exibe os SQL gerado no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
