<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestão de Ações e Corretoras</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-primary);
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .card p {
            color: var(--text-secondary);
            flex-grow: 1;
            line-height: 1.6;
        }

        .stat {
            font-size: 3rem;
            font-weight: 800;
            margin: 1rem 0 0 0;
            color: var(--accent-primary);
        }

        .card.acoes .stat {
            color: var(--accent-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Gestão Financeira</h1>
            <nav class="nav-links">
                <a href="/dashboard" class="active">Dashboard</a>
                <a href="/dashboard/corretoras">Corretoras</a>
                <a href="/dashboard/acoes">Ações</a>
            </nav>
        </header>

        <main class="dashboard-cards">
            <a href="/dashboard/corretoras" class="card">
                <h2>Corretoras Cadastradas</h2>
                <p>Gerencie as corretoras parceiras validadas junto à CVM.</p>
                <div class="stat" th:text="${corretorasCount}">0</div>
            </a>

            <a href="/dashboard/acoes" class="card acoes">
                <h2>Ações Monitoradas</h2>
                <p>Acompanhe os ativos financeiros do mercado BR e US.</p>
                <div class="stat" th:text="${acoesCount}">0</div>
            </a>
        </main>
    </div>
</body>
</html>
