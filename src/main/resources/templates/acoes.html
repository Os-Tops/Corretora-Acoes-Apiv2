<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ações - Gestão Financeira</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Modern Base Styles (Similar to Index) */
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-primary);
        }

        /* Table Styles */
        .table-container {
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .ticker-badge {
            background: rgba(255,255,255,0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 800;
            letter-spacing: 1px;
            font-family: monospace;
            color: var(--accent-primary);
        }

        .price {
            font-weight: 600;
            color: #34d399; /* Greenish for money */
        }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Ações Monitoradas</h1>
            <nav class="nav-links">
                <a href="/dashboard">Dashboard</a>
                <a href="/dashboard/corretoras">Corretoras</a>
                <a href="/dashboard/acoes" class="active">Ações</a>
            </nav>
        </header>

        <div class="table-container">
            <table th:if="${not #lists.isEmpty(acoes)}">
                <thead>
                    <tr>
                        <th>Ticker</th>
                        <th>Posição</th>
                        <th>Empresa</th>
                        <th>Mercado</th>
                        <th>Quantidade</th>
                        <th>Cotação</th>
                        <th>Preço Médio</th>
                        <th>Data Atualização</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="acao : ${acoes}">
                        <td><span class="ticker-badge" th:text="${acao.ticker}">TICKER</span></td>
                        <td class="price" th:text="${acao.moeda + ' ' + acao.posicao}">BRL 0.00</td>
                        <td th:text="${acao.nomeEmpresa}">Nome Empresa</td>
                        <td th:text="${acao.mercado}">BR</td>
                        <td th:text="${acao.quantidadeTotal}"> Quantidade </td>
                        <td class="price" th:text="${acao.moeda + ' ' + acao.cotacaoAtual}">BRL 0.00</td>
                        <td class="price" th:text="${acao.moeda + ' ' + acao.precoMedio}">BRL 0.00</td>
                        <td th:text="${#temporals.format(acao.dataHoraCotacao, 'dd/MM/yyyy HH:mm:ss')}">01/01/2026</td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${#lists.isEmpty(acoes)}" class="empty-state">
                <p>Nenhuma ação monitorada no momento.</p>
                <p>Utilize a API POST /acoes para cadastrar via Ticker.</p>
            </div>
        </div>
    </div>
</body>
</html>
